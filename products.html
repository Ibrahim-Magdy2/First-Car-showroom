<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse vehicle accessories and products at Your Brand." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Your Brand" />
    <meta property="og:title" content="Your Brand | Products" />
    <meta property="og:description" content="Browse automotive accessories and products at Your Brand." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <title>Your Brand | Products</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="products">
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="brand" aria-label="Your Brand home">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>Your Brand</span>
        </a>
        <nav class="main-nav" aria-label="Main navigation" data-i18n-aria-label="mainNavigation">
          <a href="index.html" data-i18n="navHome">Home</a>
          <a href="inventory.html" data-i18n="navInventory">Inventory</a>
          <a href="products.html" aria-current="page" data-i18n="navbarProducts">Products</a>
          <a href="admin.html" data-i18n="navAdmin">Manage catalog</a>
        </nav>
        <div class="control-row">
          <button id="theme-toggle" class="icon-button" aria-label="Switch to light mode"><i class="fas fa-moon"></i></button>
          <div class="lang-switcher" aria-label="Language switcher" data-i18n-aria-label="languageSwitcher">
            <button class="lang-option is-active" data-lang-option="en" aria-pressed="true">EN</button>
            <button class="lang-option" data-lang-option="ar" aria-pressed="false">AR</button>
          </div>
        </div>
      </div>
    </header>

    <main class="products-page">
      <div class="container">
        <header class="products-heading" data-reveal>
          <span class="eyebrow" data-i18n="productsEyebrow">Showroom essentials</span>
          <h1 data-i18n="productsTitle">Products for every drive.</h1>
          <p data-i18n="productsIntro">Explore accessories and products curated for your vehicle.</p>
        </header>
        <div id="products-grid" class="products-grid" aria-live="polite"></div>
        <div id="products-empty" class="empty-card products-empty" hidden>
          <h2 data-i18n="productsEmpty">No products are available yet. Please check back soon.</h2>
          <a class="btn btn-primary" href="admin.html" data-i18n="navAdmin">Manage catalog</a>
        </div>
      </div>
    </main>
  </body>
</html>
